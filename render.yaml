services:
  - type: worker
    name: telegram-member-tracker-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false        # Render dashboard mein manually set karo
      - key: MONGO_URL
        sync: false        # Render dashboard mein manually set karo
      - key: CHECK_INTERVAL
        value: "3600"      # 1 ghante mein check (seconds mein)
      - key: REMOVAL_DAYS
        value: "30"        # 30 din baad remove
